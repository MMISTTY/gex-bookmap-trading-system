[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-bookmap-trading-system"
version = "0.1.0"
description = "Auditable GEX and Bookmap order-flow research with paper-only execution"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
gexbook = "gexbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
